      <p class="style40"><br>

      <p class="style15">Mad
Doc Software is looking for Environment artists to help us create
next-generation worlds for upcoming projects. Candidates must be able
to create immersive, living, and fully-realized environments through
lighting, object placement, models, and textures. A portfolio
demonstrating exceptional 3D environments is required. All applicants
will be considered. </p>
      <p class="style36">RESPONSIBILITIES:</p>
      <ul class="style15">
		<li class="style15">Create visually stunning 3D game environments</li>
		<li class="style15">Work with the team to create balanced solutions to all related technical and aesthetic issues.</li>
      </ul>
      <p class="style15" style15="" style32=""><strong>REQUIREMENTS:</strong></p>
<ul class="style15">
	<li class="style15">Bachelors Degree in Art from a competitive program preferred.</li>
	<li class="style15">Traditionally
skilled artist with an exceptional understanding of photography and
composition, color, space, structure, and form.</li>
	<li class="style15">2+ years of experience of modeling and mapping for video games.</li>
	<li class="style15">Proven industry experience as environmental artist on at least one AAA title.</li>
	<li class="style15">Expert-level skill in Photoshop.</li>
	<li class="style15">Expert-level skill in 3D Studio Max, Maya, or equivalent 3D program.</li>
	<li class="style15">Applicants
with a strong understanding of lighting and shadows in games including
radiosity, ray-tracing, HDRL, dynamic lighting, lightmaps and vertex
lighting preferred</li>
	<li class="style15">Strong understanding of
development issues involved in getting environments into a game and
experienced level design and implementation.</li>
	<li class="style15">Excellent problem-solving skills.  Ability to work in a self-directed manner and to make timely, well-thought out decisions.</li>
	<li class="style15">Strong interpersonal and communication skills.  Must be able to work closely with Artists, Designers and Programmers.</li>
	<li class="style15">Positive, solution-oriented individual with a passion for game development.</li>
	</ul>
      <p class="style15" style15="" style32=""><strong>PLUSES:</strong></p>
<ul class="style15">
	<li class="style15">Production experience with PS3, XBOX 360, and/or PC.</li>
	<li class="style15">Production experience with UnrealEd or Gamebryo.</li>
	</ul>

Mad Doc offers opportunities for growth and advancement, a competitive
salary and benefits package and a great work environment. This is a
